# git push → 自动构建并部署到 Cloudflare Workers(静态资产直传现有 Worker,
# 保留已绑定的自定义域名与中文子域名,不影响 CF IP 优选等配置)
# 一次性配置见 README「部署」章节：
#   1. Worker 名在 wrangler.jsonc 的 name 字段(当前: snow-plume)
#   2. GitHub 仓库 Settings → Secrets and variables → Actions 添加：
#      CLOUDFLARE_API_TOKEN   （CF 面板 → My Profile → API Tokens，权限 Account · Workers Scripts · Edit）
#      CLOUDFLARE_ACCOUNT_ID  （CF 面板右侧可见）
#      CONTENT_REPO_TOKEN     （GitHub Fine-grained PAT，仅授予私有内容仓库 Snow-Plume-content 的 Contents 只读权限）
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch: # 允许在 Actions 页手动触发

concurrency:
  group: workers-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 博客文章不进主仓库(见 README「博客内容与代码分离」),构建前从私有内容仓库拉取
      - name: Checkout private blog content
        uses: actions/checkout@v4
        with:
          repository: PCFXPCFX/Snow-Plume-content
          path: src/content/blog
          token: ${{ secrets.CONTENT_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # wrangler-action 不经 shell 执行命令,$VAR 不会展开,动态值一律用 ${{ }} 表达式
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
